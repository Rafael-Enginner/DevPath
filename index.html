<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPath · Mapa de estudos de Engenharia de Software</title>
  <meta name="description" content="Trilha interativa que transforma as disciplinas de Engenharia de Software em prática: conceitos, ferramentas, projetos por nível e revisão.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%269%27 fill=%27none%27 stroke=%27%2338bdf8%27 stroke-width=%276%27/%3E%3C/svg%3E">
  <script>
    /* Roda antes da pintura para evitar flash de tema. A alternância fica em js/theme.js */
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("devpath:theme")); } catch (e) { /* sem tema salvo */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-level="all">
  <a class="skip" href="#content">Pular para o conteúdo</a>
  <aside class="side">
    <div class="brand">DevPath</div>
    <div class="progress" aria-live="polite"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"/><circle id="ring" class="fg" cx="22" cy="22" r="18"/></svg><p><strong id="pct">0%</strong><span id="count">0 de 20 tópicos</span></p></div>
    <nav id="nav" aria-label="Estações da trilha"></nav>
  </aside>
  <div class="wrap">
    <header class="top">
      <input id="search" type="search" placeholder="Buscar conceito, ferramenta ou projeto" aria-label="Buscar">
      <button id="theme" type="button">Modo escuro</button>
    </header>
    <div class="picker" role="group" aria-label="Filtrar projetos por nível">
      <button type="button" data-pick="all" aria-pressed="true">Todos os níveis</button>
      <button type="button" data-pick="ini" aria-pressed="false">Iniciante</button>
      <button type="button" data-pick="mid" aria-pressed="false">Intermediário</button>
      <button type="button" data-pick="sen" aria-pressed="false">Sênior</button>
    </div>
    <main>
      <section class="hero">
        <h1>Da sala de aula ao portfólio, estação por estação.</h1>
        <p>Cada disciplina do seu curso virou uma parada desta linha. Em cada tópico você aprende o conceito, pratica com ferramentas reais, escolhe um projeto do seu nível e revisa com flashcards.</p>
      </section>
      <div id="content" tabindex="-1"></div>
    </main>
  </div>
  <p id="status" class="sr-only" role="status"></p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
